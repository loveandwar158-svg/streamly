<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>Streamly — Watch. Share. Belong.</title>
<style>
:root{--bg:#0f1014;--panel:#181a21;--panel2:#20232c;--line:#2b2e39;--muted:#a5a8b5;--text:#f5f6fa;--accent:#8b5cf6;--accent2:#6d45df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.top{height:68px;position:sticky;top:0;z-index:5;background:#111217ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 26px}.brand{font-weight:900;font-size:23px;letter-spacing:-1px;white-space:nowrap}.brand b{color:#a78bfa}.search{margin:auto;display:flex;width:min(560px,48vw);background:var(--panel);border:1px solid var(--line);border-radius:30px;overflow:hidden}.search input{background:none;border:0;outline:0;color:white;padding:12px 18px;flex:1;min-width:0}.search button{background:var(--panel2);padding:0 20px}.top-actions{display:flex;gap:10px}.btn{padding:10px 15px;border-radius:24px;background:var(--panel2);font-weight:650}.btn.primary{background:var(--accent);color:white}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1600px;margin:auto}.side{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px)}.nav{width:100%;text-align:left;padding:12px 14px;background:transparent;border-radius:12px;color:#d5d6de;margin-bottom:5px}.nav.active,.nav:hover{background:var(--panel2);color:white}.nav span{display:inline-block;width:28px}.side hr{border:0;border-top:1px solid var(--line);margin:18px 6px}.side small{color:var(--muted);padding:0 14px}.main{padding:25px 28px 60px;min-width:0}.chips{display:flex;gap:9px;overflow:auto;padding-bottom:20px}.chip{white-space:nowrap;padding:8px 15px;background:var(--panel2);border-radius:22px;color:#ddd}.chip.active{background:white;color:#111}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}.video{min-width:0;cursor:pointer}.thumb{height:auto;aspect-ratio:16/9;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,#292b43,#5742a6);display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;background:#09090bbd;border-radius:30px;padding:7px 13px;font-size:13px}.duration{position:absolute;bottom:9px;right:9px;background:#08080bcc;padding:3px 7px;border-radius:5px;font-size:12px}.vinfo{display:flex;gap:11px;padding-top:12px}.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:#5941a6;font-weight:800}.vtitle{font-weight:700;line-height:1.35;margin-bottom:5px}.meta{font-size:13px;color:var(--muted)}.section-title{font-size:22px;margin:0 0 18px}.empty{color:var(--muted);padding:50px;text-align:center}.modal-bg{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{display:block;width:100%;padding:12px 14px;background:#101117;border:1px solid var(--line);border-radius:10px;color:white;margin:9px 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.close{float:right;background:transparent;color:var(--muted);font-size:23px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{padding:9px 14px;border-radius:9px;background:var(--panel2)}.tab.active{background:var(--accent)}.adminstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--panel2);padding:18px;border-radius:13px}.stat strong{font-size:26px;display:block}.notice{border:1px solid #4b3a77;background:#231b38;padding:12px 15px;border-radius:12px;color:#d9ccff;margin-bottom:22px;font-size:13px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:180px 1fr}.side{padding:16px 8px}.main{padding:20px}}
@media(max-width:650px){.top{height:60px;padding:0 13px;gap:12px}.brand{font-size:20px}.search{width:auto;flex:1}.search input{padding:10px;width:70px}.search button{padding:0 12px}.top-actions .hide-mobile{display:none}.layout{display:block}.side{display:flex;position:sticky;top:60px;z-index:4;min-height:0;overflow:auto;padding:8px;background:#111217;border-right:0;border-bottom:1px solid var(--line)}.side .nav{white-space:nowrap;width:auto;padding:9px 12px;margin:0}.side .nav span{width:auto;margin-right:5px}.side hr,.side small{display:none}.main{padding:18px 13px}.grid{grid-template-columns:1fr;gap:22px}.thumb{border-radius:12px}.adminstats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="brand">▶ <b>Stream</b>ly</div><form class="search" id="searchForm"><input id="searchInput" placeholder="Search videos, creators..." aria-label="Search"><button>⌕</button></form><div class="top-actions"><button class="btn hide-mobile" onclick="openUpload()">＋ Upload</button><button class="btn primary" onclick="openSignIn()">Sign in</button></div></header>
<div class="layout"><aside class="side"><button class="nav active" data-page="home"><span>⌂</span>Home</button><button class="nav" data-page="trending"><span>↗</span>Trending</button><button class="nav" data-page="subscriptions"><span>▣</span>Subscriptions</button><hr><small>YOU</small><button class="nav" data-page="history"><span>◷</span>History</button><button class="nav" data-page="playlists"><span>▤</span>Playlists</button><button class="nav" data-page="liked"><span>♡</span>Liked videos</button><hr><small>CREATOR</small><button class="nav" data-page="channel"><span>◉</span>My channel</button><button class="nav" data-page="studio"><span>▦</span>Creator studio</button><button class="nav" data-page="admin"><span>⚙</span>Admin dashboard</button></aside>
<main class="main"><div class="notice">Welcome to the Streamly preview. Explore the design and try the demo interactions. This preview does not yet store real accounts or upload videos to a server.</div><div id="content"></div></main></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const videos=[
{title:'I Tried Waking Up at 5 AM for 30 Days',creator:'Aarav Creates',views:'128K views',time:'2 days ago',duration:'12:48',cat:'Lifestyle',img:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900',initial:'A'},
{title:'The Most Beautiful Places You Need to Visit',creator:'Wander World',views:'84K views',time:'1 day ago',duration:'18:21',cat:'Travel',img:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900',initial:'W'},
{title:'Build a Stronger Body: Beginner Gym Guide',creator:'Fit with Dev',views:'310K views',time:'5 days ago',duration:'09:36',cat:'Fitness',img:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=900',initial:'D'},
{title:'How I Made My First Website',creator:'Code Simplified',views:'56K views',time:'3 days ago',duration:'22:04',cat:'Technology',img:'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900',initial:'C'},
{title:'A Calm Evening: Music for Focus',creator:'Sound Garden',views:'1.2M views',time:'1 week ago',duration:'1:02:15',cat:'Music',img:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900',initial:'S'},
{title:'Street Food Tour — Delhi at Night',creator:'Food Trails',views:'92K views',time:'4 days ago',duration:'16:52',cat:'Food',img:'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=900',initial:'F'},
{title:'Minimal Desk Setup on a Budget',creator:'Aarav Creates',views:'41K views',time:'6 days ago',duration:'08:17',cat:'Lifestyle',img:'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900',initial:'A'},
{title:'Learn English Naturally: Daily Phrases',creator:'Speak Easy',views:'205K views',time:'2 weeks ago',duration:'14:03',cat:'Education',img:'https://images.unsplash.com/photo-1455390582262-044c2586c8b2?w=900',initial:'E'},
{title:'The Art of Cinematic Video Editing',creator:'Frame by Frame',views:'67K views',time:'1 week ago',duration:'11:44',cat:'Technology',img:'https://images.unsplash.com/photo-1536240478700-b869070f9279?w=900',initial:'F'}];
let page='home',category='All',liked=new Set(),subs=new Set(),history=[],comments={},uploaded=[];const content=document.getElementById('content');
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='admin'){content.innerHTML=`<h1 class="section-title">Admin dashboard</h1><div class="notice">Demo admin view — real moderation, user controls and analytics will be connected in the production backend.</div><div class="adminstats"><div class="stat"><span class="meta">Total users</span><strong>1,284</strong><span class="meta">＋12% this month</span></div><div class="stat"><span class="meta">Videos</span><strong>${videos.length+uploaded.length}</strong><span class="meta">Demo content</span></div><div class="stat"><span class="meta">Reports pending</span><strong>3</strong><span class="meta">Needs review</span></div></div><h2>Platform management</h2><div class="tabs"><button class="tab active">Overview</button><button class="tab" onclick="alert('User management will be connected to the backend.')">Users</button><button class="tab" onclick="alert('Video moderation will be connected to the backend.')">Videos</button><button class="tab" onclick="alert('Reports will be connected to the backend.')">Reports</button></div><p class="meta">As the platform owner, you will eventually manage accounts, content, reports, and settings here.</p>`;return}
let list=[...videos,...uploaded];if(page==='liked')list=list.filter(v=>liked.has(v.title));if(page==='subscriptions')list=list.filter(v=>subs.has(v.creator));if(page==='trending')list=list.slice().sort((a,b)=>parseViews(b.views)-parseViews(a.views));if(page==='history')list=list.filter(v=>history.includes(v.title));if(page==='playlists')list=list.filter(v=>liked.has(v.title));if(page==='channel'||page==='studio')list=list.filter(v=>v.creator==='You');if(page==='home'&&category!=='All')list=list.filter(v=>v.cat===category);let title={home:'Recommended for you',trending:'Trending now',subscriptions:'Your subscriptions',history:'Watch history',playlists:'Your playlist',liked:'Liked videos',channel:'My channel',studio:'Creator studio'}[page]||'Videos';content.innerHTML=`<h1 class="section-title">${title}</h1>${page==='home'?`<div class="chips">${['All','Music','Technology','Lifestyle','Travel','Fitness','Food','Education'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div>`:''}<div class="grid">${list.map((v,i)=>`<article class="video" onclick="watch(${videos.concat(uploaded).indexOf(v)})"><div class="thumb"><img src="${v.img||'https://images.unsplash.com/photo-1492684223066-ive7f4b5e5e5?w=900'}" alt=""><span class="play">▶ Play preview</span><span class="duration">${v.duration||'00:00'}</span></div><div class="vinfo"><div class="avatar">${v.initial||'Y'}</div><div><div class="vtitle">${esc(v.title)}</div><div class="meta">${esc(v.creator)}<br>${v.views||'0 views'} · ${v.time||'Just now'}</div></div></div></article>`).join('')}</div>${list.length?'':'<div class="empty">Nothing here yet. Explore videos or sign in to get started.</div>'}`}
function parseViews(s){return parseFloat(s)||0}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function watch(i){let v=[...videos,...uploaded][i];if(!v)return;history.unshift(v.title);document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="thumb" style="margin-bottom:18px"><img src="${v.img}" alt=""><span class="play">▶ Preview</span></div><h2>${esc(v.title)}</h2><p class="meta">${esc(v.creator)} · ${v.views||'0 views'} · ${v.time||'Just now'}</p><div class="tabs"><button class="tab" onclick="toggleLike('${esc(v.title)}')">♡ ${liked.has(v.title)?'Liked':'Like'}</button><button class="tab" onclick="shareVideo('${esc(v.title)}')">↗ Share</button><button class="tab" onclick="toggleSub('${esc(v.creator)}')">${subs.has(v.creator)?'Subscribed':'＋ Subscribe'}</button></div><h3>Comments</h3><div id="commentList">${(comments[v.title]||[]).map(c=>`<p>${esc(c)}</p>`).join('')||'<p class="meta">Be the first to comment.</p>'}</div><input class="field" id="commentInput" placeholder="Add a comment..."><button class="btn primary" onclick="addComment('${esc(v.title)}')">Comment</button>`;openModal()}
function toggleLike(t){liked.has(t)?liked.delete(t):liked.add(t);watch([...videos,...uploaded].findIndex(v=>v.title===t));}function toggleSub(c){subs.has(c)?subs.delete(c):subs.add(c);watch([...videos,...uploaded].findIndex(v=>v.creator===c));}function shareVideo(t){if(navigator.clipboard)navigator.clipboard.writeText(location.href+'#'+encodeURIComponent(t));alert('Demo share link copied (if clipboard permission is available).')}
function addComment(t){let x=document.getElementById('commentInput').value.trim();if(!x)return;(comments[t]??=[]).push(x);watch([...videos,...uploaded].findIndex(v=>v.title===t))}
function openModal(){document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}function openSignIn(){document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Welcome to Streamly</h2><p class="meta">Sign in to follow creators and build your channel.</p><label>Email</label><input class="field" type="email" placeholder="you@example.com"><label>Password</label><input class="field" type="password" placeholder="Your password"><button class="btn primary" onclick="alert('Real sign-in will be enabled when the backend is connected.');closeModal()">Continue</button><p class="meta">This is a visual demo; accounts are not created yet.</p>`;openModal()}
function openUpload(){document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Upload a video</h2><label>Video title</label><input id="upTitle" class="field" placeholder="Give your video a title"><label>Category</label><select id="upCat" class="field"><option>Technology</option><option>Music</option><option>Lifestyle</option><option>Travel</option><option>Fitness</option><option>Food</option><option>Education</option></select><label>Choose a video file (demo only)</label><input id="upFile" class="field" type="file" accept="video/*"><button class="btn primary" onclick="demoUpload()">Add to preview</button><p class="meta">This adds a temporary preview card only. It does not upload to a server.</p>`;openModal()}
function demoUpload(){let t=document.getElementById('upTitle').value.trim();if(!t){alert('Please enter a video title.');return}let f=document.getElementById('upFile').files[0];uploaded.unshift({title:t,creator:'You',views:'0 views',time:'Just now',duration:'New',cat:document.getElementById('upCat').value,img:f?URL.createObjectURL(f):'https://images.unsplash.com/photo-1492684223066-ive7f4b5e5e5?w=900',initial:'Y'});closeModal();page='channel';render()}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();let q=document.getElementById('searchInput').value.toLowerCase();page='home';category='All';let found=[...videos,...uploaded].filter(v=>(v.title+' '+v.creator+' '+v.cat).toLowerCase().includes(q));content.innerHTML=`<h1 class="section-title">Search results for “${esc(q)}”</h1><div class="grid">${found.map(v=>`<article class="video" onclick="watch(${videos.concat(uploaded).indexOf(v)})"><div class="thumb"><img src="${v.img}" alt=""><span class="play">▶ Play preview</span></div><div class="vinfo"><div class="avatar">${v.initial||'Y'}</div><div><div class="vtitle">${esc(v.title)}</div><div class="meta">${esc(v.creator)} · ${v.views||'0 views'}</div></div></div></article>`).join('')}</div>${found.length?'':'<p class="empty">No matching videos found.</p>'}`});render();
</script></body></html>
